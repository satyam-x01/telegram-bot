<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Video Streamer & Downloader • YouTube & Instagram</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e17;
            --bg-card: rgba(18, 24, 38, 0.75);
            --bg-card-hover: rgba(26, 35, 56, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(56, 189, 248, 0.3);
            --primary: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.35);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.3);
            --success: #10b981;
            --yt-red: #ef4444;
            --insta-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Ambient Glow Effects */
        .ambient-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 {
            top: -100px;
            left: -100px;
            background: var(--primary);
        }
        .glow-2 {
            bottom: -100px;
            right: -100px;
            background: var(--accent);
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(10, 14, 23, 0.85);
            border-bottom: 1px solid var(--border-glass);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-text span {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .nav-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 20px;
            font-weight: 600;
        }

        /* Container */
        .main-container {
            position: relative;
            z-index: 10;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px 60px;
            flex: 1;
        }

        /* Search / URL input bar */
        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 6px;
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--border-accent);
            box-shadow: 0 0 24px var(--primary-glow);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 10px 16px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .btn-inspect {
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-inspect:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        /* Main Video Viewer Card */
        .viewer-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        /* Video Player Wrapper */
        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* Player Poster / Placeholder */
        .player-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }

        .player-poster-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
            transition: var(--transition);
        }

        .player-placeholder:hover .player-poster-img {
            filter: brightness(0.75) scale(1.02);
        }

        .play-btn-circle {
            position: relative;
            z-index: 2;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            box-shadow: 0 0 32px var(--primary-glow);
            transition: var(--transition);
        }

        .player-placeholder:hover .play-btn-circle {
            transform: scale(1.1);
        }

        /* Video Meta Details */
        .video-meta {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-glass);
        }

        .meta-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .platform-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .tag-youtube {
            background: rgba(239, 68, 68, 0.15);
            color: var(--yt-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .tag-instagram {
            background: rgba(236, 72, 153, 0.15);
            color: var(--insta-pink);
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .duration-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .video-title {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .video-author {
            font-size: 0.88rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Quality & Action Section */
        .controls-section {
            padding: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Quality Cards Grid */
        .quality-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .quality-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .quality-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .quality-card.selected {
            background: rgba(6, 182, 212, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .quality-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .quality-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
        }

        .quality-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Action Buttons Row */
        .actions-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-action {
            flex: 1;
            min-width: 180px;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-stream {
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: #fff;
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-stream:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px var(--primary-glow);
        }

        .btn-download {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px var(--accent-glow);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Status & Loading Bar */
        .status-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .navbar {
                padding: 12px 16px;
            }
            .main-container {
                padding: 16px 12px 40px;
            }
            .video-title {
                font-size: 1.1rem;
            }
            .quality-grid {
                grid-template-columns: 1fr 1fr;
            }
            .btn-action {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Navigation Header -->
    <header class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon">⚡</div>
            <div class="brand-text">
                <h1>Cloud Media Portal</h1>
                <span>Fast Streamer & Downloader</span>
            </div>
        </a>
        <span class="nav-badge">● Online 24/7</span>
    </header>

    <!-- Main Content Container -->
    <main class="main-container">
        <!-- URL Input & Inspector -->
        <div class="search-box">
            <input type="text" id="videoUrlInput" class="search-input" placeholder="Paste any YouTube or Instagram link (or shorts/reels)..." value="{{ initial_url }}">
            <button id="btnInspect" class="btn-inspect" onclick="loadVideo()">
                <span>Inspect Video</span> 🚀
            </button>
        </div>

        <!-- Video Card & Player -->
        <div id="videoViewerCard" class="viewer-card hidden">
            <!-- Player Area -->
            <div class="player-wrapper">
                <video id="htmlVideoPlayer" controls playsinline preload="none" class="hidden"></video>
                <div id="playerPlaceholder" class="player-placeholder" onclick="startStreamSelected()">
                    <img id="posterImg" class="player-poster-img" src="" alt="Thumbnail">
                    <div class="play-btn-circle">▶</div>
                </div>
            </div>

            <!-- Video Information -->
            <div class="video-meta">
                <div class="meta-top-row">
                    <span id="platformBadge" class="platform-tag tag-youtube">YouTube</span>
                    <span id="durationBadge" class="duration-badge">0:00</span>
                </div>
                <h2 id="videoTitle" class="video-title">Loading video details...</h2>
                <div class="video-author">
                    <span>👤</span> <span id="videoAuthor">Channel</span>
                </div>
            </div>

            <!-- Quality & Resolution Controls -->
            <div class="controls-section">
                <div class="section-header">
                    <span class="section-title">
                        <span>🎯</span> Select Preferred Quality:
                    </span>
                    <span id="selectedQualityLabel" style="font-size: 0.8rem; color: var(--primary); font-weight: 600;">720p HD</span>
                </div>

                <!-- Formats Grid -->
                <div id="qualityGrid" class="quality-grid">
                    <!-- Populated dynamically -->
                </div>

                <!-- Action Buttons -->
                <div class="actions-row">
                    <button id="btnPlayStream" class="btn-action btn-stream" onclick="startStreamSelected()">
                        <span>▶️ Watch Online</span>
                    </button>
                    <button id="btnDownloadFile" class="btn-action btn-download" onclick="startDownloadSelected()">
                        <span>⬇️ Download to Device</span>
                    </button>
                </div>

                <!-- Processing / Loading Indicator -->
                <div id="statusIndicator" class="status-box hidden">
                    <div class="spinner"></div>
                    <span id="statusMessage" class="status-text">Preparing video stream...</span>
                </div>
            </div>
        </div>

        <!-- Initial Placeholder State (When no link provided) -->
        <div id="emptyStateBox" class="viewer-card empty-state">
            <div class="empty-state-icon">🎬</div>
            <h3 style="font-size: 1.15rem; margin-bottom: 8px;">No video loaded yet</h3>
            <p style="font-size: 0.88rem; max-width: 420px; margin: 0 auto;">
                Paste any YouTube link, Shorts, or Instagram Reel above to stream or download in high quality!
            </p>
        </div>
    </main>

    <script>
        let currentVideoData = null;
        let selectedQuality = "720p";

        document.addEventListener("DOMContentLoaded", () => {
            const initialUrl = document.getElementById("videoUrlInput").value.trim();
            if (initialUrl) {
                loadVideo();
            }
        });

        async function loadVideo() {
            const url = document.getElementById("videoUrlInput").value.trim();
            if (!url) {
                alert("Please paste a valid YouTube or Instagram video link.");
                return;
            }

            const btnInspect = document.getElementById("btnInspect");
            btnInspect.disabled = true;
            btnInspect.innerHTML = `<div class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></div> Loading...`;

            try {
                const res = await fetch(`/api/video_info?url=${encodeURIComponent(url)}`);
                const json = await res.json();

                if (!res.ok || !json.success) {
                    throw new Error(json.error || "Unable to extract video details.");
                }

                currentVideoData = json.data;
                renderVideoDetails(currentVideoData);
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btnInspect.disabled = false;
                btnInspect.innerHTML = `<span>Inspect Video</span> 🚀`;
            }
        }

        function renderVideoDetails(data) {
            document.getElementById("emptyStateBox").classList.add("hidden");
            const viewer = document.getElementById("videoViewerCard");
            viewer.classList.remove("hidden");

            // Meta
            document.getElementById("videoTitle").textContent = data.title;
            document.getElementById("videoAuthor").textContent = data.uploader;
            document.getElementById("durationBadge").textContent = `⏱️ ${data.duration_str}`;

            const badge = document.getElementById("platformBadge");
            if (data.platform === "Instagram") {
                badge.className = "platform-tag tag-instagram";
                badge.textContent = "Instagram";
            } else {
                badge.className = "platform-tag tag-youtube";
                badge.textContent = "YouTube";
            }

            // Thumbnail / Poster
            const poster = document.getElementById("posterImg");
            if (data.thumbnail) {
                poster.src = data.thumbnail;
                poster.style.display = "block";
            } else {
                poster.style.display = "none";
            }

            // Reset Player
            const player = document.getElementById("htmlVideoPlayer");
            player.pause();
            player.classList.add("hidden");
            document.getElementById("playerPlaceholder").classList.remove("hidden");

            // Formats
            const grid = document.getElementById("qualityGrid");
            grid.innerHTML = "";

            const formats = data.formats || [
                { quality: "720p", label: "720p HD", desc: "Standard", ext: "mp4" }
            ];

            // Pick default
            selectedQuality = formats.some(f => f.quality === "720p") ? "720p" : formats[0].quality;

            formats.forEach(f => {
                const card = document.createElement("div");
                card.className = `quality-card ${f.quality === selectedQuality ? "selected" : ""}`;
                card.id = `qCard_${f.quality}`;
                card.onclick = () => selectQuality(f.quality, f.label);

                card.innerHTML = `
                    <div class="quality-label">
                        <span>${f.label}</span>
                        <span class="quality-tag">.${f.ext}</span>
                    </div>
                    <div class="quality-desc">${f.desc || "Standard"}</div>
                `;
                grid.appendChild(card);
            });

            updateSelectedLabel();
        }

        function selectQuality(qKey, label) {
            selectedQuality = qKey;
            document.querySelectorAll(".quality-card").forEach(c => c.classList.remove("selected"));
            const card = document.getElementById(`qCard_${qKey}`);
            if (card) card.classList.add("selected");
            updateSelectedLabel();
        }

        function updateSelectedLabel() {
            document.getElementById("selectedQualityLabel").textContent = selectedQuality.toUpperCase();
        }

        function getStreamUrl(isDownload = false) {
            if (!currentVideoData || !currentVideoData.url) return "";
            return `/api/media_stream?url=${encodeURIComponent(currentVideoData.url)}&quality=${encodeURIComponent(selectedQuality)}&download=${isDownload ? "1" : "0"}`;
        }

        function startStreamSelected() {
            if (!currentVideoData) return;
            const player = document.getElementById("htmlVideoPlayer");
            const placeholder = document.getElementById("playerPlaceholder");
            const statusBox = document.getElementById("statusIndicator");
            const statusMsg = document.getElementById("statusMessage");

            statusMsg.textContent = `Buffering ${selectedQuality.toUpperCase()} stream...`;
            statusBox.classList.remove("hidden");

            const streamUrl = getStreamUrl(false);
            player.src = streamUrl;
            player.classList.remove("hidden");
            placeholder.classList.add("hidden");

            player.play()
                .then(() => {
                    statusBox.classList.add("hidden");
                })
                .catch((e) => {
                    console.log("Auto-play waiting for user interaction:", e);
                    statusBox.classList.add("hidden");
                });
        }

        function startDownloadSelected() {
            if (!currentVideoData) return;
            const statusBox = document.getElementById("statusIndicator");
            const statusMsg = document.getElementById("statusMessage");

            statusMsg.textContent = `Preparing ${selectedQuality.toUpperCase()} download...`;
            statusBox.classList.remove("hidden");

            const downloadUrl = getStreamUrl(true);
            
            // Create hidden link to trigger native download
            const a = document.createElement("a");
            a.href = downloadUrl;
            a.download = "";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                statusBox.classList.add("hidden");
            }, 3000);
        }
    </script>
</body>
</html>
